[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name            = "pyforestry"
version         = "0.0.1"
description     = "Forest‑model toolkit"
readme          = "README.md"
requires-python = ">=3.10"
authors         = [{name = "Carl Vigren", email = "carl.vigren@slu.se"}]
license         = {text = "MIT"}
urls            = {Homepage = "https://github.com/Silviculturalist/pyforestry"}
dependencies    = [
  "numpy",
  # Imported at module scope by the simulation core, the ensemble engine, the
  # solution cube and the Sweden presets, and returned from public APIs
  # (SimulationContext.to_pandas, run_projection). It used to arrive only as a
  # transitive geopandas dependency, so the package worked by accident.
  "pandas",
  "tqdm",
  "xarray",
  "scipy>=1.5",
  "geopandas",
  "shapely",
  "pyproj"
]

[project.optional-dependencies]

#optional country-specific dependencies
sweden = []
norway = []
germany = []

# optional feature backends (kept out of the base install to stay lightweight)
accel = ["jax", "numba"]   # acceleration backends for the batch/ensemble engine
plot = ["matplotlib"]      # plotting helpers (e.g. Bucker.plot)


all = [
  "pyforestry[sweden]",
  "pyforestry[norway]",
  "pyforestry[germany]",
  "pyforestry[accel]",
  "pyforestry[plot]"
]

#Dev dependencies for writing documentation and testing.
dev = [
  "pyforestry[all]",     # exercise the optional backends (jax/numba/matplotlib) in tests
  "pytest",
  "pytest-cov",          # measure coverage
  "docstr-coverage",     # docstring coverage
  "coverage",            # coverage engine
  # Pinned: CI hard-gates on `ruff format --check`, and ruff's formatter changes
  # its output between releases. Unpinned, a new ruff turns CI red with no code
  # change. Bump deliberately, running `ruff format .` in the same commit.
  "ruff==0.12.3",
  "hypothesis",          # property-based testing
  "build",
  "twine",
  "sphinx",              # docs tool
  "pydata-sphinx-theme", # theme with version switcher support
  "myst-parser",         # if you want Markdown support
]

# ----- setuptools‑specific bits -----
[tool.setuptools]
package-dir = {"" = "src"}   # tell setuptools where the code now lives

[tool.setuptools.packages.find]
where = ["src"]              # automatic discovery under src/

# ship **all** shapefile components
[tool.setuptools.package-data]
"pyforestry.sweden.geo.humidity"  = ["humidity.*"]
"pyforestry.sweden.geo.climate"   = ["klimat.*"]
"pyforestry.sweden.geo.coastline" = ["swedishcoastline_ne_medium_clipped.*"]
"pyforestry.sweden.geo.counties"  = ["rt_dlanskod.*"]
# Fitted SIS site-category decision trees (loaded by generated_site_category_trees.py)
"pyforestry.sweden.siteindex.sis" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [ #Ignore warning from pyogrio
  "ignore:The 'shapely.geos' module is deprecated:DeprecationWarning:pyogrio"
]
addopts = [
  "--import-mode=importlib",
  "--cov=pyforestry",                # measure your package
  "--cov-report=term-missing",  # show missing lines in console
  "--cov-report=html"           # generate htmlcov/
]

# --- Ruff Configuration ---
[tool.ruff]
line-length = 99
# Exclude documentation notebooks and generated docs artifacts.
exclude = [
  "docs/source/notebooks/*",
  "docs/source/notebooks/_archive/*",
  "docs/_build/*",
]
# Enable import-sorting, standard lint rules, and bug-finding

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]

# --- Bumpversion Configuration ---
[tool.bumpversion]
# Bump the version in this file only. The search pattern allows flexible spacing
# around the equals sign so the command can locate the current value.
current_version = "0.0.1"

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version\s*=\s*"{current_version}"'
replace = 'version = "{new_version}"'
regex = true
