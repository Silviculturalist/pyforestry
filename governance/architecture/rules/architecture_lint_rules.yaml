# Architecture lint rules for pyforestry.
#
# These rules enforce ownership boundaries defined in ARCHITECTURE.md.
# Rules are promoted from advisory to blocking as migration progresses.
# See ROADMAP.md Section 8 for the lint promotion matrix.

rules:
  AL001:
    name: No scientific coefficients in */adapters
    scope: Changed files under src/pyforestry/*/adapters/
    mode: blocking  # for changed files
    description: >
      An adapter binds published equations to the simulation runtime: it reads a
      Stand, calls kernels from a domain package, and writes results back. It does
      not own numbers. Any float literal carrying three or more significant
      decimals -- what a fitted regression coefficient looks like -- is a
      violation, excluding exact powers of ten, which are unit and scale factors
      no coefficient lands on.

      There is no exception list and no budget. A module that needs to hold
      coefficients is either a whole published growth-and-yield system, which goes
      in */systems/, or a standalone published equation, which goes in a domain
      package (growth/, mortality/, volume/, ...). Both alternatives are
      well-defined, so an exception register would only record a misfiling.

      This replaces the earlier form of AL001, which was scoped to Sweden and
      carried a registry of seven exempted modules. Both existed because */blocks/
      held systems and adapters in one directory and the check could not tell them
      apart; splitting the directory removed the need for either.
    checks:
      - no_scientific_coefficient_literals   # */adapters/ in every region

  AL002:
    name: Context dependency direction must be valid
    scope: Python import graph for changed modules
    mode: advisory
    description: >
      Formula/equation modules must not import from simulation policy or
      orchestration packages. Allowed direction: equations -> primitives;
      adapters/systems -> equations + primitives; simulation -> adapters/systems
      + equations.
    forbidden_edges:
      - from: "*/mortality/*.py, */siteindex/*.py, */volume/*.py, */bark/*.py, */biomass/*.py"
        to: "*/simulation/presets/*, */simulation/policy/*, */simulation/orchestration/*"
