# Architecture lint rules for pyforestry.
#
# These rules enforce ownership boundaries defined in ARCHITECTURE.md.
# Rules are promoted from advisory to blocking as migration progresses.
# See ROADMAP.md Section 8 for the lint promotion matrix.
#
# This file is the documented half of the rule set; scripts/check_architecture_lint.py
# is the enforcing half, and its `check_registry()` fails the run when the two
# disagree about which rules exist or whether each blocks. Adding a rule to one
# without the other is now a build failure rather than silent drift.

rules:
  AL001:
    name: No scientific coefficients in */adapters
    scope: Changed files under src/pyforestry/*/adapters/
    mode: blocking  # for changed files
    description: >
      An adapter binds published equations to the simulation runtime: it reads a
      Stand, calls kernels from a domain package, and writes results back. It does
      not own numbers. Any float literal carrying three or more significant
      decimals -- what a fitted regression coefficient looks like -- is a
      violation, excluding exact powers of ten, which are unit and scale factors
      no coefficient lands on.

      There is no exception list and no budget. A module that needs to hold
      coefficients is either a whole published growth-and-yield system, which goes
      in */systems/, or a standalone published equation, which goes in a domain
      package (growth/, mortality/, volume/, ...). Both alternatives are
      well-defined, so an exception register would only record a misfiling.

      This replaces the earlier form of AL001, which was scoped to Sweden and
      carried a registry of seven exempted modules. Both existed because */blocks/
      held systems and adapters in one directory and the check could not tell them
      apart; splitting the directory removed the need for either.
    checks:
      - no_scientific_coefficient_literals   # */adapters/ in every region

  AL002:
    name: Context dependency direction must be valid (equation modules)
    scope: Python import graph for changed modules under a domain package
    mode: blocking
    description: >
      Formula/equation modules must not import from simulation policy or
      orchestration packages. Allowed direction: equations -> primitives;
      adapters/systems -> equations + primitives; simulation -> adapters/systems
      + equations.

      Registered advisory while the migration was in progress; the migration is
      done and the codebase has been clean of this for the whole of it, so the
      rule is now blocking -- which is also what the script always did to it.
    forbidden_edges:
      - from: "*/bark/*.py, */biomass/*.py, */growth/*.py, */height/*.py, */ingrowth/*.py,
               */mortality/*.py, */regeneration/*.py, */siteindex/*.py, */taper/*.py,
               */volume/*.py"
        to: "*/simulation/presets/*, */simulation/policy/*, */simulation/orchestration/*,
             */simulation/contracts.py"

  AL003:
    name: Context dependency direction must be valid (adapters and systems)
    scope: Python import graph for changed modules under */adapters/ or */systems/
    mode: blocking
    description: >
      The model tier binds equations to the runtime, so it may import equations
      and primitives, but not the scenario policy, presets or orchestration that
      drive it. An adapter that reads a ruleset has inverted the direction: the
      simulation tier chooses models, not the other way round.

      Same forbidden targets as AL002, applied to a different source set. Both
      were one rule in ARCHITECTURE.md's prose and two functions in the script;
      registering AL003 separately is what makes the second one visible.
    forbidden_edges:
      - from: "*/adapters/*.py, */systems/**/*.py"
        to: "*/simulation/presets/*, */simulation/policy/*, */simulation/orchestration/*,
             */simulation/contracts.py"

  AL004:
    name: No generated placeholder docstrings
    scope: All files under src/pyforestry/
    mode: blocking
    description: >
      Docstring coverage measures presence, not content, and 161 generated
      docstrings once satisfied it on this package's most important classes --
      each stating only that a parameter is a parameter or that a callable
      returns. `help()` was then worse than nothing, because the output looked
      documented.

      This rule fails on the generator's fingerprints. Write what the callable
      does, what its arguments mean and what it returns, or leave it undocumented
      and let the coverage gate say so.
    checks:
      - no_generated_docstring_markers

  AL005:
    name: No model constructs its own random generator
    scope: All files under src/pyforestry/, except the RNG service
    mode: blocking
    description: >
      A generator built where it is used cannot be seeded by the run that owns it
      and cannot be checkpointed. Worse, when two of them are seeded from the same
      scalar -- which the Elfving 2010 composite did, one NumPy and one stdlib --
      the order in which the two are drawn from becomes an unwritten part of every
      result: reorder two calls that touch different generators and the numbers
      move, with nothing in the code saying they were coupled.

      Stochastic kernels take rng as a parameter. Runs get theirs from
      ctx.rng.child(...), which derives an independent stream per path from the
      run's single seed, so two subsystems cannot disturb each other's draws
      whatever order they run in. RandomBundle and KeyedRNG are the only modules
      permitted to call a generator constructor.
    checks:
      - no_random_Random_construction
      - no_numpy_default_rng_construction

  AL006:
    name: A stochastic collaborator is handed the run's stream
    scope: >
      All files under src/pyforestry/, except the RNG service and the checkpoint
      loader, and except a module constructing a class it defines itself.
    mode: blocking
    description: >
      AL005 stops a model building a generator out of thin air. It does not stop
      the subtler thing, because that one goes through the RNG service and so
      looks correct: a component that accepts rng= is constructed without it,
      falls back to a seed carried on its config, and -- when the constructing
      code runs once per period -- reopens the identical stream every period.

      Four instances shipped before this rule existed. The composite pipeline
      rebuilt its mortality engine each period without rng=, so stochastic
      mortality drew the same numbers in period 1, 2, 3 and 4; the engine built
      its tree models with only stochastic_seed, with the same result one level
      down; build_context acquired its inventory before opening the run's bundle,
      so every adapter fell back to a hard-coded seed whatever the run's seed
      said; and the pipeline's own constructor built an engine six lines before
      the bundle existed. None of them tripped AL005, and none of them moved a
      pinned number, because the pinned scenarios are deterministic.

      The collaborators are discovered, not listed: any class in the package that
      takes an rng parameter is one, so a new stochastic component comes under the
      rule without anyone remembering to register it. A module may construct a
      class it defines itself without a stream -- that is the documented fallback
      keeping a directly-constructed component reproducible on its own terms.
    checks:
      - stochastic_collaborator_receives_rng
