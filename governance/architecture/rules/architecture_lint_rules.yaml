# Architecture lint rules for pyforestry.
#
# These rules enforce ownership boundaries defined in ARCHITECTURE.md.
# Rules are promoted from advisory to blocking as migration progresses.
# See ROADMAP.md Section 8 for the lint promotion matrix.

rules:
  AL001:
    name: No new formula-heavy internals in */models (or */blocks)
    scope: Changed files under src/pyforestry/*/models/
    mode: blocking  # for changed files
    description: >
      Model facade modules must remain thin delegations (install_formula_facade).
      New coefficient blocks, equation kernels, or scientific formula functions
      must not be added directly in model/block modules.

      Enforced in two parts. A module using install_formula_facade must define no
      classes or functions. Any other block module is checked for scientific
      coefficient literals (floats carrying three or more significant decimals,
      which is what fitted regression coefficients look like); more than
      AL001_COEFFICIENT_BUDGET of them means the module holds equations rather
      than composing them. The only modules allowed to do so are the
      self-contained published model systems ARCHITECTURE.md Context 3 names,
      listed in AL001_SELF_CONTAINED_MODEL_SYSTEMS in the check script. Anything
      else must move its equations into a domain package, or be entered in the
      exception register with an owner and exit criteria.
    checks:
      - no_class_definitions          # facade modules only
      - no_function_definitions       # facade modules only
      - uses_install_formula_facade
      - coefficient_budget            # non-facade block modules

  AL002:
    name: Context dependency direction must be valid
    scope: Python import graph for changed modules
    mode: advisory
    description: >
      Formula/equation modules must not import from simulation policy or
      orchestration packages. Allowed direction: equations -> primitives;
      blocks -> equations + primitives; simulation -> blocks + equations.
    forbidden_edges:
      - from: "*/mortality/*.py, */siteindex/*.py, */volume/*.py, */bark/*.py, */biomass/*.py"
        to: "*/simulation/presets/*, */simulation/policy/*, */simulation/orchestration/*"
