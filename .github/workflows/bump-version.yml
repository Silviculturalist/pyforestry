name: Bump Patch Version

# The job commits the bumped pyproject.toml back to main, which needs write
# access. Without this block the workflow inherits the repository default
# (read-only), so bump-my-version ran, the commit was created, and the push then
# failed with "Permission to ... denied to github-actions[bot]" / 403 -- every
# run since 2025-07-19. ci.yml already declares its own permissions for the same
# reason: its badge commit and Pages deploy also push.
permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [pyproject.toml]

jobs:
  bump:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install bump-my-version
        run: pip install bump-my-version

      - name: Bump patch
        id: bump
        run: |
          bump-my-version bump patch --allow-dirty --no-tag
          echo "new=$(grep '^version' pyproject.toml | head -1 | cut -d '"' -f2)" >> $GITHUB_OUTPUT

      - name: Commit and push
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: bump version to ${{ steps.bump.outputs.new }}"
          file_pattern: pyproject.toml
